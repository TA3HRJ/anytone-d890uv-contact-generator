name: Generate Contact Lists

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

# Elle tetikleme zamanlanmış çalıştırmayla çakışırsa ikisi aynı anda Pages'e
# deploy etmeye çalışır. Sıraya alınsınlar; devam eden üretim iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # asılı kalan indirme runner'ı saatlerce meşgul etmesin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      # Kayıt sayıları bir önceki çalışmanın %80'inin altına düşerse
      # generator.py burada hata verir ve deploy adımı hiç çalışmaz.
      - name: Generate contact lists
        run: python generator.py

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp output/*.csv output/stats.json _site/
          cp index.html _site/
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/{{GENERATED_DATE}}/$DATE/g" _site/index.html
          # stats.json'u sayfayla aynı sürüme bağla; ayrı önbelleklendikleri için
          # bu olmadan taze tarih eski sayılarla birlikte görünebiliyor.
          sed -i "s/{{VERSION}}/$(date -u +%Y%m%d%H%M)/g" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
