name: Generate Contact Lists

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

# Elle tetikleme zamanlanmış çalıştırmayla çakışırsa ikisi aynı anda Pages'e
# deploy etmeye çalışır. Sıraya alınsınlar; devam eden üretim iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # asılı kalan indirme runner'ı saatlerce meşgul etmesin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      # Kayıt sayıları bir önceki çalışmanın %80'inin altına düşerse
      # generator.py burada hata verir ve deploy adımı hiç çalışmaz.
      - name: Generate contact lists
        run: python generator.py

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp output/*.csv output/stats.json _site/
          cp index.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Zamanlanmış çalıştırma sessizce başarısız olursa yayındaki listeler eskir ve
  # kimsenin haberi olmaz. Issues sekmesi mobilde de görünüyor, Deployments'ın aksine.
  notify-failure:
    needs: [generate, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report the failed run as an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Otomatik kişi listesi üretimi başarısız
          LABEL: uretim-hatasi
          BODY: |
            Günlük üretim başarısız oldu; indirme sayfasındaki listeler bugünden
            itibaren eskiyor.

            Başarısız çalıştırma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Sık görülen sebepler: radioid.net dökümüne ulaşılamaması, kayıt
            sayılarının bir önceki çalıştırmanın %80'inin altına düşmesi
            (generator.py bu durumda mevcut çıktının üzerine yazmayı reddediyor),
            ya da testlerin kalması.

            Sorun giderilip iş yeniden başarıyla koştuğunda bu issue elle kapatılmalı.
        run: |
          set -euo pipefail

          # Etiket yoksa oluştur; gh issue create var olmayan etiketle hata veriyor.
          gh label create "$LABEL" --repo "$REPO" --color B60205 \
            --description "Zamanlanmış üretim başarısız oldu" 2>/dev/null || true

          # Aynı arıza günlerce sürerse her sabah yeni issue açılmasın: açık bir
          # bildirim varsa ona yorum düşülüyor. Etiketle eşleştirmek başlık
          # aramasından sağlam - arama indeksinin gecikmesine bağlı değil.
          existing=$(gh issue list --repo "$REPO" --state open --label "$LABEL" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Yeniden başarısız oldu: $RUN_URL"
            echo "Commented on existing issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label "$LABEL" --body "$BODY"
            echo "Opened a new issue"
          fi
